<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>firga gelatos
    </title>
</head>
<body>
    <div id="cabecalho">
        <img src="images/logo.png" alt="">
        <h1>firga gelatos</h1>
    </div>

    <div id="telaprincipal">
        <div class="card">
            <img src="images/geladinho_ninho.jpg" alt="" class="img">
            <h3 id="nome">geladinho de leite ninho</h3>
            <h3 id="preco">R$ uma porshe 911</h3>
            <button class="btn">compre agora</button>
        </div>

        <div class="card">
            <img src="images/geladinho_morango.jpg" alt="" class="img">
            <h3 id="nome">geladinho de morango</h3>
            <h3 id="preco">R$ uma porshe 911</h3>
            <button class="btn">compre agora</button>
        </div>

        <div class="card">
            <img src="images/geladinho_chocolate.jpg" alt="" class="img">
            <h3 id="nome">geladinho de chocolate</h3>
            <h3 id="preco">R$ uma porshe 911</h3>
            <button class="btn">compre agora</button>
        </div>
    </div>
</body>

<style>
@import url('https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap');
    *{
        font-family: 'Imperial Script';
    }

    h1{
        margin-left: 600px;
        font-size: 60px;
    }

    #cabecalho{
        display: flex;
        align-items: center;
    }

    .img{
        width: 350px;
        border-radius: 16px;
    }

    #nome, #preco{
        font-size: 40px;
    }

    .card{
        margin-top: 20px;
        text-align: center;
    }

    .btn{
        background-color:#a93c64 ;
        color: white;
        font-size: 40px;
        border: none;
        border-radius: 12px;
        padding: 20px ;
        cursor: pointer;
        transition: linear 0.5s;
    }

    #telaprincipal{
        display: flex;
        justify-content: space-evenly;
    }

    .btn:hover{
        background-color: #ff96bc;
    }
    
</style>
</html>
